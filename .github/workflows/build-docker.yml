name: Build and test Docker images
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        target:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Test and build native candidate
        env:
          ARCH: ${{ matrix.target.arch }}
          SALVAGE_TEST_DOCKER: isolated
        run: |
          bash ./gradlew test jibDockerBuild -Djib.from.platforms=linux/$ARCH -Djib.to.image=candidate:gate --no-daemon
          python3 tests/docker_safety.py candidate:gate
      - name: Publish exact native candidate
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag candidate:gate "$image"
          docker push "$image"
  publish:
    needs: native
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish index for both tested architectures
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-$GITHUB_SHA-r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          refs=()
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect "$image:$version-$arch" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$image@$digest")
          done
          tags=(-t "$image:$version")
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            tags+=(-t "$image:master" -t "$image:latest" -t "$image:edge")
          else
            tags+=(-t "$image:$GITHUB_REF_NAME")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
  gate:
    name: ci-gate
    if: always()
    needs: [native, publish]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NATIVE: ${{ needs.native.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: test "$NATIVE" = success && { test "$PUBLISH" = success || test "$PUBLISH" = skipped; }
